# Keeps GitHub Actions pinned versions current.
#
# Only repos with their own workflow steps need this. The image repos call
# daemonless/workflows/.github/workflows/daemonless-build.yaml@v1, and the
# actions they actually run are pinned there, not here.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # One PR for all action bumps rather than one per action.
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
    open-pull-requests-limit: 3
