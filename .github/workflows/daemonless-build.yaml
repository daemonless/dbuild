name: Reusable App Build

# Moved to daemonless/workflows. Call
#   daemonless/workflows/.github/workflows/daemonless-build.yaml@v1
# This pass-through keeps old callers building until they move.

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name (e.g., radarr, sonarr)'
        required: true
        type: string
      variant:
        description: 'Variant to build (blank=all)'
        required: false
        type: string
        default: ''
      pre_artifact_name:
        description: 'Artifact name to download before build (e.g. web-dist)'
        required: false
        type: string
        default: ''
      pre_artifact_path:
        description: 'Path to download pre-build artifact into (e.g. web/dist/)'
        required: false
        type: string
        default: ''
      registry:
        description: 'Container registry prefix (e.g. ghcr.io/myorg). Defaults to ghcr.io/daemonless'
        required: false
        type: string
        default: 'ghcr.io/daemonless'
      build_tools_ref:
        description: 'build-tools release tag to use (default: latest release)'
        required: false
        type: string
        default: ''
      generate:
        description: 'Run dbuild generate before build/commit to keep Containerfile*/README.md in sync with templates'
        required: false
        type: boolean
        default: true
      arch:
        description: 'Restrict CI to a single architecture (e.g. amd64). Blank = use the org default (daemonless defaults to amd64-only; other orgs build every architecture listed in .daemonless/config.yaml).'
        required: false
        type: string
        default: ''
      dbuild_ref:
        description: 'Override the dbuild ref to fetch (branch, tag, or commit SHA). Blank = use the pinned release. For testing unreleased dbuild changes only -- do not set this for real fleet images.'
        required: false
        type: string
        default: ''
      linux:
        description: 'Also build the image for Linux from Containerfile.linux (amd64 and arm64, on GitHub runners), test it, and add it to the default variant''s tags. Only this workflow builds Linux images.'
        required: false
        type: boolean
        default: false
      build_timeout:
        description: 'Minutes before a build job is cancelled. A hung VM otherwise runs to the 6-hour cap; the slowest real build in the fleet takes about 150.'
        required: false
        type: number
        default: 180

jobs:
  build:
    uses: daemonless/workflows/.github/workflows/daemonless-build.yaml@v1
    with:
      image_name: ${{ inputs.image_name }}
      variant: ${{ inputs.variant }}
      pre_artifact_name: ${{ inputs.pre_artifact_name }}
      pre_artifact_path: ${{ inputs.pre_artifact_path }}
      registry: ${{ inputs.registry }}
      build_tools_ref: ${{ inputs.build_tools_ref }}
      generate: ${{ inputs.generate }}
      arch: ${{ inputs.arch }}
      dbuild_ref: ${{ inputs.dbuild_ref }}
      linux: ${{ inputs.linux }}
      build_timeout: ${{ inputs.build_timeout }}
    secrets: inherit
