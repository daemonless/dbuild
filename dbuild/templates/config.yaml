# dbuild configuration file
# Place in .daemonless/config.yaml or .dbuild.yaml (higher priority)
#
# Full reference: https://github.com/daemonless/dbuild

build:
{{ build_block }}

cit:
  mode: health
  port: {{ port }}
  health: /
  # A line the app logs once it serves; without a match the test waits out its timeout
  # ready: "listening on"
  {%- if mlock %}
  annotations:
    - "org.freebsd.jail.allow.mlock=true"
  {%- endif %}
