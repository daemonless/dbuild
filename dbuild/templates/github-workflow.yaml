name: Build FreeBSD Container

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Tag to rebuild (blank = all)'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  build:
    uses: daemonless/workflows/.github/workflows/daemonless-build.yaml@v1
    with:
      image_name: {{ name }}
      variant: ${{ inputs.variant }}
    secrets: inherit
