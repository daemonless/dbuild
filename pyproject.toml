[build-system]
requires = ["setuptools>=63"]
build-backend = "dbuild.build_backend"
backend-path = ["."]

[project]
name = "dbuild"
description = "FreeBSD OCI container image build tool"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "jinja2",
]
license = {text = "BSD-2-Clause"}

[project.optional-dependencies]
screenshot = ["selenium>=4", "scikit-image>=0.23"]
dev = ["pytest>=7", "ruff>=0.9", "jsonschema>=4", "referencing>=0.30"]

[project.scripts]
dbuild = "dbuild.cli:main"

[tool.setuptools.dynamic]
version = {attr = "dbuild.VERSION"}

[tool.setuptools.packages.find]
include = ["dbuild*"]

[tool.setuptools.package-data]
"dbuild.templates" = ["*.yaml", "Containerfile", "*.j2", "*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "E501",  # line length (handled by formatter)
    "SIM108", # ternary operator (readability)
]
